[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "financed-emissions"
version = "0.1.0"
description = "Financed emissions (Scope 3 category 15) by the PCAF Part A methods, with the arithmetic shown for every position."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kerem Özdemir" }]
keywords = ["pcaf", "financed-emissions", "scope-3", "category-15", "ghg-accounting", "climate-finance", "carbon-accounting", "mcp", "mcp-server"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Keremozdemirra/financed-emissions"
Issues = "https://github.com/Keremozdemirra/financed-emissions/issues"
"Method source" = "https://carbonaccountingfinancials.com/en/standard"

[project.scripts]
financed-emissions = "financed_emissions:main"

[tool.setuptools]
py-modules = ["financed_emissions", "financed_emissions_mcp"]
