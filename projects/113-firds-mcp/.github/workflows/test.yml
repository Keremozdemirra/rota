name: test

# Unit tests against recorded ESMA and GLEIF answers: no network, no token. The last step installs
# the package and speaks MCP to the installed command, still without network.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
      - run: |
          pip install .
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | firds-mcp | grep -q '"isin_to_group"'
