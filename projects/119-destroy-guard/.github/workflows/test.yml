name: test

# Offline: fake terraform, kubectl and helm executables written by the tests,
# and the runner's own git against local bare repositories. No network, no token.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # pinned to 24.04: newer Ubuntu images have no Python 3.9 build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: pip install . && destroy-guard check -- terraform plan
