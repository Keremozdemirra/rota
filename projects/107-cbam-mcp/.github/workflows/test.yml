name: test

# Against recorded fixtures and the bundled snapshot. No network, no token.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      # From outside the checkout, so the installed wheel (and the data it carries) is what answers.
      - run: pip install . && cd "$RUNNER_TEMP" && cbam-mcp scope 7208 51 20 && cbam-mcp value 7601 10 00 India
