name: test

# Offline: the tests replay recorded Climate TRACE answers from a server on
# 127.0.0.1. No network, no token.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # ubuntu-24.04, not ubuntu-latest: newer images have no Python 3.9 build.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      # The bundled definitions snapshot must ship inside the installed package.
      - name: Installed package finds its snapshot
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          climate-trace-mcp --version
          python -c "from climate_trace_mcp.provenance import Snapshot; s = Snapshot.load(); assert len(s.subsectors) == 69, s.error"
