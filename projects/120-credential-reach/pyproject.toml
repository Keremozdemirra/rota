[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "credential-reach"
version = "0.1.0"
description = "What credentials could an AI agent running as you on this machine use? Lists them without printing a secret."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Kerem Özdemir" }]
keywords = ["ai-agents", "claude-code", "credentials", "secrets", "security-audit", "blast-radius", "least-privilege"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Keremozdemirra/credential-reach"
Issues = "https://github.com/Keremozdemirra/credential-reach/issues"

[project.scripts]
credential-reach = "credential_reach:main"

[tool.setuptools]
py-modules = ["credential_reach"]
